# Required before merge: manifests parse, the skill's frontmatter is valid, and the
# scripts answer from the live MCP server on the oldest and newest supported Python.
# The live call is the real end-to-end test: the skill is only useful if
# altairworld.com serves the tools it calls. Re-run this check after a server fix.

name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.8
            3.13

      - name: Offline Claude/Codex package validation on Python 3.8 and 3.13
        run: |
          for python in python3.8 python3.13; do
            "$python" scripts/validate_package.py
            "$python" -m unittest discover -s scripts -p 'test_*.py' -v
          done

      - name: Regression tests on Python 3.8 and 3.13
        run: |
          for python in python3.8 python3.13; do
            "$python" -m unittest discover -s tests -v
          done

      - name: Live research on Python 3.8 and 3.13
        run: |
          script=skills/altair-research/scripts/altair_research.py
          for python in python3.8 python3.13; do
            "$python" "$script" tickers | tee tickers.md
            grep -q 'SPY (' tickers.md
            "$python" "$script" latest SPY NVDA --summary-chars 120 | tee latest.md
            test "$(grep -c '^## [A-Z]* · analysis date' latest.md)" -eq 2
            if grep -q 'unavailable' latest.md; then exit 1; fi
          done

      - name: Live market breadth and indicators on Python 3.8 and 3.13
        run: |
          script=skills/altair-market/scripts/altair_market.py
          for python in python3.8 python3.13; do
            "$python" "$script" breadth --days 5 | tee breadth.md
            grep -Eq '^# Altair market breadth · reading date [0-9]{4}-[0-9]{2}-[0-9]{2}$' breadth.md
            for index in SPX NDX SOX; do
              grep -Eq "^\| $index .*\| [0-9]+% \| [0-9,.]+ \|$" breadth.md
            done
            grep -Eq '^\| Information Technology \| [0-9]+ \| [0-9]+% \|$' breadth.md
            test "$(grep -Ec '^\| [0-9]{4}-[0-9]{2}-[0-9]{2} \|' breadth.md)" -eq 5
            "$python" "$script" indicators | tee indicators.md
            for index in SPX NDX SOX; do
              grep -Eq "^## $index · reading date [0-9]{4}-[0-9]{2}-[0-9]{2} · .* · close [0-9,.]+$" indicators.md
            done
            test "$(grep -Ec '^\| 200-day trend \| [-0-9.]+% \|' indicators.md)" -eq 3
            test "$(grep -Ec '^\| TD Sequential 9 \(daily\) \| [-0-9]+ \|' indicators.md)" -eq 3
            test "$(grep -Ec '^\| TD Sequential 9 \(weekly\) \| [-0-9]+ \|' indicators.md)" -eq 3
            "$python" "$script" ticker NVDA | tee ticker.md
            grep -Eq '^# Altair ticker indicators · NVDA · reading date [0-9]{4}-[0-9]{2}-[0-9]{2}$' ticker.md
            grep -Eq '^\| 200-day trend \| [-0-9.]+% \|' ticker.md
            grep -Fq '| Implied volatility (VIX, VXN, VXSMH) | n/a | unavailable | n/a |' ticker.md
            grep -Fq '| Variance risk premium | n/a | unavailable | n/a |' ticker.md
          done
